name: food_mandu
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Value Equality
  equatable: ^2.0.5

  # Functional Programming
  dartz: ^0.10.1

  # utilities
  uuid: ^4.3.3

  # Local Database (Offline Storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  
  

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: OpenSansBold
      fonts:
        - asset: assets/scans/OpenSans-Bold.ttf

    - family: OpenSansItalic
      fonts:
        - asset: assets/scans/OpenSans-Bolditalic.ttf

    - family: OpenSansRegular
      fonts:
        - asset: assets/scans/OpenSans-Regular.ttf
